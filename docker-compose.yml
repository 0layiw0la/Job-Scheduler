name: job-scheduler

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["scheduler", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    command: ["scheduler", "worker"]
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler
      SCHEDULER_POLL_INTERVAL_SECONDS: "1.0"
      SCHEDULER_LEASE_SECONDS: "60"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 3

volumes:
  postgres-data:
